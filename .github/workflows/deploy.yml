name: HelixZero-CMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Run Automated PyTest Suite (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Core Pipeline & Validation Tests
        run: |
          python -m pytest smepred/tests/test_pipeline.py -v

  build-and-push:
    name: 🐳 Build & Push Docker Image to Docker Hub (CD)
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: nitinjadhav888
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            nitinjadhav888/helixzerocms:latest
            nitinjadhav888/helixzerocms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-icecloud:
    name: 🚀 Deploy to IceCloud.in (Continuous Delivery)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Configuration
        run: |
          echo "Checking IceCloud deployment configuration..."
          if [ -z "${{ secrets.ICECLOUD_DEPLOY_WEBHOOK }}" ] && [ -z "${{ secrets.ICECLOUD_SSH_HOST }}" ]; then
            echo "ℹ️ No IceCloud deployment webhook or SSH secrets configured yet. Docker image successfully pushed to Docker Hub."
          fi

      - name: Trigger IceCloud Webhook Deployment
        if: ${{ secrets.ICECLOUD_DEPLOY_WEBHOOK != '' }}
        run: |
          echo "Triggering IceCloud deployment webhook..."
          curl -s -X POST "${{ secrets.ICECLOUD_DEPLOY_WEBHOOK }}" -H "Content-Type: application/json" -d '{"image": "nitinjadhav888/helixzerocms:latest"}' || echo "Webhook trigger completed."

      - name: Deploy via SSH to IceCloud
        if: ${{ secrets.ICECLOUD_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ICECLOUD_SSH_HOST }}
          username: ${{ secrets.ICECLOUD_SSH_USER || 'root' }}
          key: ${{ secrets.ICECLOUD_SSH_KEY }}
          port: ${{ secrets.ICECLOUD_SSH_PORT || 22 }}
          script: |
            echo "Pulling latest HelixZero-CMS Docker image on IceCloud..."
            docker pull nitinjadhav888/helixzerocms:latest
            echo "Restarting HelixZero container..."
            docker stop helixzero || true
            docker rm helixzero || true
            docker run -d \
              --name helixzero \
              --restart always \
              -p 80:8000 \
              nitinjadhav888/helixzerocms:latest
            echo "✅ HelixZero-CMS successfully updated on IceCloud.in!"
