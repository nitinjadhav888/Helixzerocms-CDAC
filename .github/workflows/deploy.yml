name: HelixZero-CMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Run Automated PyTest Suite (CI)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ".:smepred"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Hydrate Model Assets from Prebuilt Image
        run: |
          echo "Hydrating model binary assets from prebuilt container..."
          docker create --name temp_assets nitinjadhav888/helixzerocms:latest
          docker cp temp_assets:/app/smepred/models/. smepred/models/
          docker rm temp_assets
          echo "Model assets hydrated successfully!"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: "🔬 Suite 1: Core Pipeline & Parsing Tests"
        run: python -m pytest smepred/tests/test_pipeline.py -v --tb=short

      - name: "🔬 Suite 2: Biophysics & Thermodynamics Suite"
        run: python -m pytest smepred/tests/test_biophysics_suite.py -v --tb=short

      - name: "🔬 Suite 3: Retrained Potency Engine (Gold pIC50)"
        run: |
          set -o pipefail
          python -m pytest smepred/tests/test_retrained_potency_engine.py -v -s --tb=short 2>&1 | tee suite3.log || {
            echo "### ❌ Suite 3 Test Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat suite3.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: "🔬 Suite 4: Clinical FDA Benchmark (Patisiran, Givosiran, Lumasiran, Inclisiran)"
        run: python -m pytest smepred/tests/test_clinical_benchmark.py -v --tb=short

      - name: "🔬 Suite 5: 3D Structural Inspector & GNN Attention"
        run: python -m pytest smepred/tests/test_3d_inspector.py -v --tb=short

      - name: "🔬 Suite 6: MEG-mod Paper Compatibility"
        run: python -m pytest smepred/tests/test_megmod_paper.py -v --tb=short

      - name: "🔬 Suite 7: Multi-Mod Regression Edge Cases"
        run: python -m pytest smepred/tests/test_multimod_regression.py -v --tb=short

      - name: "🔬 Suite 8: 3D Ago2 Structural Docking & Collision Avoidance"
        run: python -m pytest smepred/tests/test_docking_pipeline.py -v --tb=short

      - name: "🔬 Suite 9: FastAPI Production REST API Endpoints"
        run: python -m pytest smepred/tests/test_api.py -v --tb=short

  build-and-push:
    name: 🐳 Build & Push Docker Image to Docker Hub (CD)
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: nitinjadhav888
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Hub credentials check
        if: ${{ env.DOCKERHUB_TOKEN == '' }}
        run: echo "ℹ️ DOCKERHUB_TOKEN is not set; image will be built and validated locally without push."

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKERHUB_TOKEN != '' }}
          tags: |
            nitinjadhav888/helixzerocms:latest
            nitinjadhav888/helixzerocms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
